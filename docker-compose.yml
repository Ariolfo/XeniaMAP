name: xeniamap

services:
  postgres:
    image: postgis/postgis:14-3.4
    environment:
      POSTGRES_DB: xeniamap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: xeniamap-backend:local
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./data:/data
      # Disco externo Data_XeniaMap (antes Data_Bioagro). Host → /data_xeniamap
      - ${EXTERNAL_DATA_HOST_PATH:-/mnt/disco3tb/Data_XeniaMap}:/data_xeniamap:rw
    # Deps ya en imagen; --reload con volumen ./backend:/app.
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
      ]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/xeniamap
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /data/storage
      EXTERNAL_DATA_ROOT: /data_xeniamap
      SECRET_KEY: ${SECRET_KEY}
      MAX_UPLOAD_MB: "4096"
      # Límite global por IP (Redis); subir si galería RGB / muchas miniaturas devuelven 429.
      RATE_LIMIT_WINDOW_SECONDS: "120"
      RATE_LIMIT_MAX_REQUESTS: "2000"
      PYTHONDONTWRITEBYTECODE: "1"
      # Volúmenes Docker: forzar polling para que --reload detecte cambios en .py (Linux/Mac/Win).
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  # SNAP (subset S1): ver ``docker-compose.snap.yml`` y arranque con
  #   docker compose -f docker-compose.yml -f docker-compose.snap.yml up -d worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: xeniamap-backend:local
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./data:/data
      - ${EXTERNAL_DATA_HOST_PATH:-/mnt/disco3tb/Data_XeniaMap}:/data_xeniamap:rw
      # Export Markdown de la landing (scripts/generate_landing_markdown.py lee interpretations.js)
      - ./scripts:/repo/scripts:ro
      - ./frontend/src/landing:/repo/frontend/src/landing:ro
    # watchfiles: el worker recarga al cambiar .py (uvicorn sí recarga; Celery no, sin esto seguiría el código viejo).
    # --concurrency=1: un solo proceso pesado (Sentinel-2) evita OOM / SIGKILL 9; --max-tasks-per-child libera RAM tras cada tarea.
    command:
      [
        "watchfiles",
        "--filter",
        "python",
        "celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=2",
        ".",
      ]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/xeniamap
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /data/storage
      EXTERNAL_DATA_ROOT: /data_xeniamap
      MAX_UPLOAD_MB: "4096"
      CELERY_METRICS_PORT: "9101"
    ports:
      - "9101:9101"
    env_file:
      - .env
    depends_on:
      - redis
      - postgres

  ai_service:
    profiles: ["ai"]
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    image: xeniamap-ai:local
    working_dir: /app
    volumes:
      - ./ai_service:/app
      - ./data:/data
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: xeniamap-frontend:local
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Conserva node_modules de la imagen (el bind mount no los pisa).
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      # Sin VITE_API_URL: el cliente usa el mismo origen (:5173) + /api/v1 y Vite hace proxy al backend
      BACKEND_PROXY_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  # Nombre legacy del volumen Docker (no renombrar: conserva datos Postgres existentes).
  postgres_data:
    external: true
    name: bioagromap_postgres_data
  frontend_node_modules:
