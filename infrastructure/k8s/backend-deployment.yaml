apiVersion: apps/v1
kind: Deployment
metadata:
  name: xeniamap-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xeniamap-backend
  template:
    metadata:
      labels:
        app: xeniamap-backend
    spec:
      containers:
        - name: backend
          image: your-registry/xeniamap-backend:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: xeniamap-backend
spec:
  selector:
    app: xeniamap-backend
  ports:
    - port: 80
      targetPort: 8000
